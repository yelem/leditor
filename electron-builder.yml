appId: com.leditor.app
productName: Leditor
directories:
  buildResources: resources
publish:
  provider: github
  owner: yelem
  repo: leditor
files:
  - '!**/.vscode/*'
  - '!**/.claude/*'
  - '!src/*'
  - '!scripts/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md,FEATURES.md,BUILD-MAC.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!book-editor-spec.md'
# Project extension association. On macOS a .bookproj is a package (folder),
# so isPackage: true makes double-click open the app.
fileAssociations:
  - ext: bookproj
    name: Leditor Project
    description: Leditor book project
    role: Editor
    isPackage: true
    icon: resources/icon.ico
win:
  target:
    - nsis
  icon: resources/icon.ico
  artifactName: ${name}-${version}-setup.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: ${productName}
  createDesktopShortcut: true
mac:
  target:
    - target: dmg
      arch:
        - universal
    # electron-updater's macOS updater (Squirrel.Mac) applies updates from a
    # zipped app bundle, not the dmg — required for auto-update to work.
    - target: zip
      arch:
        - universal
  category: public.app-category.productivity
  icon: resources/icon.icns
  artifactName: ${name}-${version}.${ext}
  hardenedRuntime: true
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  # Usage strings for the TCC prompts the app can trigger: a project lives in a
  # folder the user picks, which may be Documents/Desktop/Downloads, an external
  # disk or a network share. Without these keys macOS shows a bare prompt.
  extendInfo:
    NSDocumentsFolderUsageDescription: >-
      Leditor stores and opens book projects in folders you choose.
    NSDesktopFolderUsageDescription: >-
      Leditor stores and opens book projects in folders you choose.
    NSDownloadsFolderUsageDescription: >-
      Leditor stores and opens book projects in folders you choose.
    NSRemovableVolumesUsageDescription: >-
      Leditor opens book projects and writes backups on external disks you choose.
    NSNetworkVolumesUsageDescription: >-
      Leditor opens book projects and writes backups on network volumes you choose.
  # Notarization runs automatically when APPLE_ID/APPLE_APP_SPECIFIC_PASSWORD/
  # APPLE_TEAM_ID (or CSC_LINK signing identity) are set in the environment.
dmg:
  artifactName: ${name}-${version}.${ext}
